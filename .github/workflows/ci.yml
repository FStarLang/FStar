name: CI

on:
  # Only run on pushes to master; PRs and the merge queue are covered by
  # the pull_request and merge_group triggers. Other branches can use
  # workflow_dispatch.
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:
  merge_group:

defaults:
  run:
    shell: bash

jobs:
  # opam and nix builds run on a nightly schedule, see nightly-ci.yml.
  # It is a bit excessive to run them on every push.

  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@master
        with:
          submodules: true

      - uses: ./.github/actions/setup-fstar-deps

      - name: Run CI
        run: make -skj$(nproc) ci

  # Branch protection points here
  ciok:
    runs-on: ubuntu-26.04
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    # ^ Workaround for insane github behavior: https://github.com/actions/runner/issues/2566
    needs:
      - ci
    steps:
      # Note: we only run on failure. Otherwise this is skipped, which counts
      # as a success.
      - run: exit 1
